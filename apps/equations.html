<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plot Points — Coordinate Grid</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  display: flex;
  gap: 24px;
  padding: 20px;
  background: #f6f8fb;
  margin: 0;
  flex-wrap: wrap;
}
#sidebar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 300px;
  min-width: 260px;
}
h1, h2 {
  font-size: 18px;
  margin: 0;
}
h2 { font-size: 15px; color: #333; }
#hint {
  font-size: 14px;
  color: #444;
  line-height: 1.4;
}
.panel {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 10px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
th, td {
  padding: 6px 4px;
  text-align: center;
}
th {
  font-weight: 700;
  border-bottom: 2px solid #ddd;
}
td input[type="number"] {
  width: 52px;
  padding: 4px;
  font-size: 14px;
  text-align: center;
  border: 1px solid #bbb;
  border-radius: 4px;
}
.dot-swatch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
  display: inline-block;
}
.row-remove {
  border: none;
  background: none;
  color: #888;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 0 4px;
}
.row-remove:hover { color: #c00; }
.row-remove:disabled {
  opacity: 0.3;
  cursor: default;
}
#addRowBtn {
  margin-top: 8px;
  padding: 6px 12px;
  font-size: 14px;
  cursor: pointer;
  border: 1px solid #bbb;
  border-radius: 4px;
  background: #f0f0f0;
}
#addRowBtn:hover { background: #e4e4e4; }
.equation-form {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 18px;
  font-family: "Times New Roman", Georgia, serif;
}
.equation-form input {
  width: 56px;
  padding: 6px;
  font-size: 16px;
  font-family: Arial, sans-serif;
  text-align: center;
  border: 1px solid #bbb;
  border-radius: 4px;
}
.equation-form input::placeholder { color: #aaa; }
#eqError {
  margin: 8px 0 0;
  font-size: 13px;
  color: #b91c1c;
  line-height: 1.35;
}
#eqError:empty { display: none; }
.equation-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.equation-header h2 { margin: 0; }
.toggle-btn {
  padding: 4px 10px;
  font-size: 12px;
  font-family: Arial, sans-serif;
  border: 1px solid #aaa;
  border-radius: 4px;
  cursor: pointer;
  background: #eee;
  white-space: nowrap;
}
.toggle-btn.active {
  background: #2563eb;
  color: #fff;
  border-color: #2563eb;
}
#graphWrapper { position: relative; }
canvas {
  background: #fff;
  border: 1px solid #ccc;
  cursor: default;
  touch-action: none;
  display: block;
}
canvas.dragging { cursor: grabbing; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Plot Points</h1>
  <p id="hint">Drag dots on the grid or type coordinates below. Click and hold a dot to see guide lines to the axes.</p>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>X</th>
          <th>Y</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="pointsBody"></tbody>
    </table>
    <button type="button" id="addRowBtn">+ Add point</button>
  </div>

  <div class="panel">
    <div class="equation-header">
      <h2>Equation</h2>
      <button type="button" id="showEqToggle" class="toggle-btn" aria-pressed="false">Show on graph</button>
    </div>
    <div class="equation-form">
      <span>y =</span>
      <input type="text" id="mInput" inputmode="decimal" placeholder="m">
      <span>x +</span>
      <input type="text" id="bInput" inputmode="decimal" placeholder="b">
    </div>
    <p id="eqError" role="alert"></p>
  </div>
</div>

<div id="graphWrapper">
  <canvas id="graph"></canvas>
</div>

<script>
const GRID_MIN = -10;
const GRID_MAX = 10;
const GRID_UNITS = GRID_MAX - GRID_MIN;

const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const pointsBody = document.getElementById('pointsBody');
const addRowBtn = document.getElementById('addRowBtn');
const mInput = document.getElementById('mInput');
const bInput = document.getElementById('bInput');
const showEqToggle = document.getElementById('showEqToggle');
const eqError = document.getElementById('eqError');

let showEquation = false;

const DISPLAY_SIZE = 640;
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const CANVAS_SIZE = Math.round(DISPLAY_SIZE * DPR);

const DOT_RADIUS = 9;
const HIT_RADIUS = 14;

const AXIS_X = () => gx(0);
const AXIS_Y = () => gy(0);

function setupHiDPICanvas() {
  canvas.style.width = DISPLAY_SIZE + 'px';
  canvas.style.height = DISPLAY_SIZE + 'px';
  canvas.width = CANVAS_SIZE;
  canvas.height = CANVAS_SIZE;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

setupHiDPICanvas();

const DOT_COLORS = ['#e11d48', '#2563eb', '#16a34a', '#ca8a04', '#9333ea'];

const dots = [
  { x: -6, y: 4 },
  { x: -2, y: -3 },
  { x: 3, y: 5 },
  { x: 7, y: -1 },
  { x: 1, y: -7 }
];

let activeDot = null;
let syncingTable = false;

function dotColor(i) { return DOT_COLORS[i % DOT_COLORS.length]; }

function clampCoord(v) {
  const n = parseInt(v, 10);
  if (Number.isNaN(n)) return 0;
  return Math.max(GRID_MIN, Math.min(GRID_MAX, n));
}

function gx(x) { return ((x - GRID_MIN) / GRID_UNITS) * DISPLAY_SIZE; }
function gy(y) { return ((GRID_MAX - y) / GRID_UNITS) * DISPLAY_SIZE; }

function mathFromPixel(px, py) {
  const x = GRID_MIN + (px / DISPLAY_SIZE) * GRID_UNITS;
  const y = GRID_MAX - (py / DISPLAY_SIZE) * GRID_UNITS;
  return {
    x: Math.max(GRID_MIN, Math.min(GRID_MAX, Math.round(x))),
    y: Math.max(GRID_MIN, Math.min(GRID_MAX, Math.round(y)))
  };
}

function dotAtPixel(px, py) {
  for (let i = dots.length - 1; i >= 0; i--) {
    const dx = px - gx(dots[i].x);
    const dy = py - gy(dots[i].y);
    if (dx * dx + dy * dy <= HIT_RADIUS * HIT_RADIUS) return i;
  }
  return null;
}

function createTableRow(i) {
  const tr = document.createElement('tr');
  tr.dataset.index = i;

  const swatchTd = document.createElement('td');
  const swatch = document.createElement('span');
  swatch.className = 'dot-swatch';
  swatchTd.appendChild(swatch);

  const xTd = document.createElement('td');
  const xIn = document.createElement('input');
  xIn.type = 'number';
  xIn.className = 'x-input';
  xIn.min = GRID_MIN;
  xIn.max = GRID_MAX;
  xIn.step = 1;
  xTd.appendChild(xIn);

  const yTd = document.createElement('td');
  const yIn = document.createElement('input');
  yIn.type = 'number';
  yIn.className = 'y-input';
  yIn.min = GRID_MIN;
  yIn.max = GRID_MAX;
  yIn.step = 1;
  yTd.appendChild(yIn);

  const removeTd = document.createElement('td');
  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'row-remove';
  removeBtn.title = 'Remove point';
  removeBtn.textContent = '×';
  removeTd.appendChild(removeBtn);

  tr.append(swatchTd, xTd, yTd, removeTd);

  xIn.addEventListener('change', () => onTableEdit(tr, 'x', xIn.value));
  yIn.addEventListener('change', () => onTableEdit(tr, 'y', yIn.value));
  xIn.addEventListener('input', () => onTableEdit(tr, 'x', xIn.value));
  yIn.addEventListener('input', () => onTableEdit(tr, 'y', yIn.value));
  removeBtn.addEventListener('click', () => removeRow(parseInt(tr.dataset.index, 10)));

  return tr;
}

function onTableEdit(row, axis, value) {
  const i = parseInt(row.dataset.index, 10);
  if (syncingTable || !dots[i]) return;
  dots[i][axis] = clampCoord(value);
  draw();
}

function removeRow(i) {
  if (dots.length <= 1) return;
  dots.splice(i, 1);
  if (activeDot === i) activeDot = null;
  else if (activeDot > i) activeDot--;
  rebuildTable();
  draw();
}

function rebuildTable() {
  pointsBody.innerHTML = '';
  dots.forEach((_, i) => pointsBody.appendChild(createTableRow(i)));
}

function syncTable() {
  if (pointsBody.children.length !== dots.length) {
    rebuildTable();
  }
  syncingTable = true;
  dots.forEach((d, i) => {
    const row = pointsBody.children[i];
    if (!row) return;
    row.dataset.index = i;
    row.querySelector('.dot-swatch').style.background = dotColor(i);
    const xIn = row.querySelector('.x-input');
    const yIn = row.querySelector('.y-input');
    const removeBtn = row.querySelector('.row-remove');
    if (document.activeElement !== xIn) xIn.value = d.x;
    if (document.activeElement !== yIn) yIn.value = d.y;
    removeBtn.disabled = dots.length <= 1;
  });
  syncingTable = false;
}

function parseEquation() {
  const mStr = mInput.value.trim();
  const bStr = bInput.value.trim();
  if (!mStr && !bStr) return null;
  const m = mStr ? parseFloat(mStr) : 0;
  const b = bStr ? parseFloat(bStr) : 0;
  if (Number.isNaN(m) || Number.isNaN(b)) return null;
  return { m, b };
}

function allPointsOnLine(m, b) {
  return dots.every(d => Math.abs(d.y - (m * d.x + b)) < 1e-6);
}

function validateEquationDisplay() {
  const eq = parseEquation();
  if (!eq) {
    return { ok: false, message: 'Enter a value for m and/or b first.' };
  }
  if (!allPointsOnLine(eq.m, eq.b)) {
    return { ok: false, message: 'All points must lie on the line y = mx + b.' };
  }
  return { ok: true, eq };
}

function showEqError(message) {
  eqError.textContent = message;
}

function clearEqError() {
  eqError.textContent = '';
}

function updateShowEqToggle() {
  showEqToggle.classList.toggle('active', showEquation);
  showEqToggle.setAttribute('aria-pressed', showEquation);
}

function enforceShowEquation() {
  if (!showEquation) return;
  const result = validateEquationDisplay();
  if (!result.ok) {
    showEquation = false;
    updateShowEqToggle();
    showEqError(result.message);
  }
}

function clipLineToGrid(m, b) {
  const inRange = (v, lo, hi) => v >= lo - 1e-9 && v <= hi + 1e-9;
  const pts = [];

  const yLeft = m * GRID_MIN + b;
  if (inRange(yLeft, GRID_MIN, GRID_MAX)) pts.push([GRID_MIN, yLeft]);

  const yRight = m * GRID_MAX + b;
  if (inRange(yRight, GRID_MIN, GRID_MAX)) pts.push([GRID_MAX, yRight]);

  if (Math.abs(m) > 1e-9) {
    const xBottom = (GRID_MIN - b) / m;
    if (inRange(xBottom, GRID_MIN, GRID_MAX)) pts.push([xBottom, GRID_MIN]);

    const xTop = (GRID_MAX - b) / m;
    if (inRange(xTop, GRID_MIN, GRID_MAX)) pts.push([xTop, GRID_MAX]);
  } else if (inRange(b, GRID_MIN, GRID_MAX)) {
    return [[GRID_MIN, b], [GRID_MAX, b]];
  }

  const unique = [];
  for (const p of pts) {
    if (!unique.some(u => Math.abs(u[0] - p[0]) < 1e-6 && Math.abs(u[1] - p[1]) < 1e-6)) {
      unique.push(p);
    }
  }
  if (unique.length < 2) return null;
  return [unique[0], unique[unique.length - 1]];
}

function drawEquationLine() {
  if (!showEquation) return;
  const result = validateEquationDisplay();
  if (!result.ok) return;
  const segment = clipLineToGrid(result.eq.m, result.eq.b);
  if (!segment) return;

  ctx.save();
  ctx.strokeStyle = '#f97316';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(gx(segment[0][0]), gy(segment[0][1]));
  ctx.lineTo(gx(segment[1][0]), gy(segment[1][1]));
  ctx.stroke();
  ctx.restore();
}

function drawGrid() {
  ctx.clearRect(0, 0, DISPLAY_SIZE, DISPLAY_SIZE);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, DISPLAY_SIZE, DISPLAY_SIZE);

  const axisX = AXIS_X();
  const axisY = AXIS_Y();

  ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
  ctx.fillStyle = '#2b2b2b';

  for (let x = GRID_MIN; x <= GRID_MAX; x++) {
    const px = gx(x);
    ctx.beginPath();
    ctx.moveTo(px, 0);
    ctx.lineTo(px, DISPLAY_SIZE);
    ctx.strokeStyle = x === 0 ? '#2b2b2b' : '#d4d4d4';
    ctx.lineWidth = x === 0 ? 2 : 1;
    ctx.stroke();
    if (x % 2 === 0 && x !== 0) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(String(x), px, axisY + 5);
    }
  }

  for (let y = GRID_MIN; y <= GRID_MAX; y++) {
    const py = gy(y);
    ctx.beginPath();
    ctx.moveTo(0, py);
    ctx.lineTo(DISPLAY_SIZE, py);
    ctx.strokeStyle = y === 0 ? '#2b2b2b' : '#d4d4d4';
    ctx.lineWidth = y === 0 ? 2 : 1;
    ctx.stroke();
    if (y % 2 === 0 && y !== 0) {
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(y), axisX + 5, py);
    }
  }

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#2b2b2b';
  ctx.fillText('0', axisX + 5, axisY + 5);
}

function drawGuideLines(dot) {
  const cx = gx(dot.x);
  const cy = gy(dot.y);
  const axisY = AXIS_Y();
  const axisX = AXIS_X();

  ctx.save();
  ctx.setLineDash([6, 4]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#64748b';

  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, DISPLAY_SIZE);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, cy);
  ctx.lineTo(DISPLAY_SIZE, cy);
  ctx.stroke();

  ctx.setLineDash([]);
  ctx.fillStyle = '#1e293b';
  ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(String(dot.x), cx, axisY + 5);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(dot.y), axisX + 5, cy);
  ctx.restore();
}

function drawDots() {
  dots.forEach((d, i) => {
    const cx = gx(d.x);
    const cy = gy(d.y);
    const isActive = activeDot === i;

    ctx.beginPath();
    ctx.arc(cx, cy, DOT_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = dotColor(i);
    ctx.fill();
    ctx.strokeStyle = isActive ? '#111' : '#fff';
    ctx.lineWidth = isActive ? 3 : 2;
    ctx.stroke();

    if (isActive) drawGuideLines(d);
  });
}

function draw() {
  enforceShowEquation();
  if (!showEquation && validateEquationDisplay().ok) clearEqError();
  drawGrid();
  drawEquationLine();
  drawDots();
  syncTable();
}

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (DISPLAY_SIZE / rect.width),
    y: (e.clientY - rect.top) * (DISPLAY_SIZE / rect.height)
  };
}

function onPointerDown(e) {
  e.preventDefault();
  const { x, y } = pointerPos(e);
  const hit = dotAtPixel(x, y);
  if (hit === null) return;
  activeDot = hit;
  canvas.classList.add('dragging');
  canvas.style.cursor = 'grabbing';
  canvas.setPointerCapture(e.pointerId);
  draw();
}

function updateCanvasCursor(px, py) {
  if (activeDot !== null) return;
  canvas.style.cursor = dotAtPixel(px, py) !== null ? 'grab' : 'default';
}

function onPointerMove(e) {
  const { x, y } = pointerPos(e);
  if (activeDot !== null) {
    const snapped = mathFromPixel(x, y);
    dots[activeDot].x = snapped.x;
    dots[activeDot].y = snapped.y;
    draw();
    return;
  }
  updateCanvasCursor(x, y);
}

function onPointerUp(e) {
  if (activeDot === null) return;
  activeDot = null;
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  const { x, y } = pointerPos(e);
  updateCanvasCursor(x, y);
  draw();
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('pointerleave', () => {
  if (activeDot === null) canvas.style.cursor = 'default';
});

showEqToggle.addEventListener('click', () => {
  if (showEquation) {
    showEquation = false;
    clearEqError();
    updateShowEqToggle();
    draw();
    return;
  }
  const result = validateEquationDisplay();
  if (!result.ok) {
    showEqError(result.message);
    return;
  }
  clearEqError();
  showEquation = true;
  updateShowEqToggle();
  draw();
});

addRowBtn.addEventListener('click', () => {
  dots.push({ x: 0, y: 0 });
  rebuildTable();
  draw();
});

function onEquationInput() {
  if (validateEquationDisplay().ok) clearEqError();
  draw();
}

mInput.addEventListener('input', onEquationInput);
bInput.addEventListener('input', onEquationInput);

rebuildTable();
draw();
</script>
</body>
</html>
